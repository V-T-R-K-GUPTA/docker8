<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎬 CineVerse · movie ticket booking</title>
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
    }

    body {
      background: radial-gradient(circle at 20% 30%, #1a1028, #0a0612 80%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* subtle glowing orbs */
    body::before,
    body::after {
      content: '';
      position: fixed;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.4;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      background: #a855f7;
      top: -100px;
      left: -100px;
    }

    body::after {
      background: #f59e0b;
      bottom: -100px;
      right: -100px;
    }

    /* main card */
    .booking-container {
      max-width: 1100px;
      width: 100%;
      background: rgba(30, 20, 50, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 42px;
      padding: 32px 36px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 0 2px rgba(168, 85, 247, 0.25), inset 0 0 80px rgba(168, 85, 247, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
      color: #f3eefc;
      position: relative;
      z-index: 1;
    }

    h1 {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #fbbf24, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 30px rgba(168, 85, 247, 0.4));
    }

    h1 i {
      background: linear-gradient(135deg, #fbbf24, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-size: 2.2rem;
      filter: drop-shadow(0 0 20px rgba(251, 191, 36, 0.6));
    }

    .subhead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 2px dashed rgba(168, 85, 247, 0.3);
    }

    .subhead p {
      font-size: 1rem;
      color: #b8a8d9;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .subhead p i {
      color: #c084fc;
    }

    .date-badge {
      background: linear-gradient(145deg, #2a1f4a, #1e1535);
      padding: 8px 22px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.95rem;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(168, 85, 247, 0.4);
      color: #e0d4ff;
    }

    .date-badge i {
      color: #fbbf24;
      margin-right: 6px;
    }

    /* movie selection row */
    .movie-picker {
      display: flex;
      gap: 20px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .movie-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: linear-gradient(145deg, #221a3a, #1a1230);
      padding: 12px 24px 12px 18px;
      border-radius: 60px;
      cursor: pointer;
      transition: all 0.25s ease;
      border: 1px solid rgba(168, 85, 247, 0.2);
      box-shadow: 0 8px 18px -6px #000000, inset 0 1px 1px rgba(255, 255, 255, 0.05);
      flex: 1 1 200px;
      position: relative;
      overflow: hidden;
    }

    .movie-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.1), rgba(168, 85, 247, 0.1));
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .movie-card:hover {
      background: #2d234a;
      border-color: rgba(251, 191, 36, 0.6);
      transform: translateY(-3px);
      box-shadow: 0 16px 26px -8px #000000, 0 0 0 1px rgba(251, 191, 36, 0.3);
    }

    .movie-card:hover::before {
      opacity: 1;
    }

    .movie-card.active {
      background: linear-gradient(145deg, #3b2b63, #2a1e4a);
      border: 2px solid #fbbf24;
      box-shadow: 0 0 30px rgba(251, 191, 36, 0.25), 0 12px 24px -8px #000000, 0 0 0 1px rgba(251, 191, 36, 0.5);
    }

    .movie-card.active::after {
      content: '\f00c';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      position: absolute;
      top: 8px;
      right: 14px;
      color: #fbbf24;
      font-size: 0.8rem;
      opacity: 0.9;
      text-shadow: 0 0 12px #fbbf24;
    }

    .movie-poster {
      font-size: 2rem;
      width: 50px;
      height: 50px;
      background: linear-gradient(145deg, #2e1f4d, #1a1230);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fbbf24;
      border: 1px solid rgba(251, 191, 36, 0.4);
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.6), 0 0 20px rgba(251, 191, 36, 0.1);
    }

    .movie-info h3 {
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 4px;
      color: #f5e9ff;
    }

    .movie-info .meta {
      font-size: 0.75rem;
      color: #b8a8d9;
      display: flex;
      gap: 10px;
    }

    .movie-info .meta span:first-child {
      color: #fbbf24;
      font-weight: 600;
    }

    /* screen + seats section */
    .screen-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
    }

    .screen {
      width: 85%;
      height: 42px;
      background: linear-gradient(180deg, #d8c5ff 0%, #9f7aea 60%, #6b46c1 100%);
      clip-path: polygon(0% 0%, 100% 0%, 90% 100%, 10% 100%);
      border-radius: 0 0 50% 50% / 0 0 100% 100%;
      margin-bottom: 22px;
      box-shadow: 0 20px 30px -8px rgba(168, 85, 247, 0.5), 0 0 40px rgba(168, 85, 247, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1e1535;
      font-weight: 800;
      letter-spacing: 8px;
      font-size: 0.85rem;
      text-transform: uppercase;
      border: 1px solid rgba(255, 255, 255, 0.3);
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.4);
    }

    .seat-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 12px 14px;
      justify-content: center;
      padding: 12px 20px;
      margin-top: 8px;
    }

    .seat {
      width: 42px;
      height: 42px;
      background: linear-gradient(145deg, #2f2352, #1e1638);
      border-radius: 14px 14px 8px 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 600;
      color: #c4b5e0;
      cursor: pointer;
      transition: 0.15s ease;
      box-shadow: 0 6px 0 #0f0a1a, 0 4px 10px #00000066;
      border-bottom: 2px solid #4a3a6e;
      user-select: none;
      position: relative;
    }

    .seat i {
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .seat:hover:not(.booked):not(.selected) {
      background: #3f2f6b;
      transform: scale(1.07);
      color: #fbbf24;
      border-bottom-color: #fbbf24;
      box-shadow: 0 6px 0 #1a0f2e, 0 0 18px rgba(251, 191, 36, 0.3);
    }

    .seat.selected {
      background: linear-gradient(145deg, #fbbf24, #d97706);
      color: #1a0f2e;
      box-shadow: 0 0 22px #fbbf24, 0 6px 0 #92400e, 0 0 0 2px rgba(255, 255, 255, 0.4);
      border-bottom: 2px solid #fde68a;
      font-weight: 800;
      transform: scale(1.05);
    }

    .seat.selected i {
      color: #1a0f2e;
      opacity: 1;
    }

    .seat.booked {
      background: #151022;
      color: #4a3f5e;
      box-shadow: 0 6px 0 #09060f, 0 2px 6px #00000033;
      cursor: not-allowed;
      border-bottom: 2px solid #2a1f3d;
      opacity: 0.5;
    }

    .seat.booked i {
      font-size: 0.8rem;
      color: #4a3f5e;
    }

    /* legend */
    .legend {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin: 25px 0 18px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #c4b5e0;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .legend-box {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      background: linear-gradient(145deg, #2f2352, #1e1638);
      box-shadow: inset 0 2px 4px #00000066;
      border: 1px solid #4a3a6e;
    }

    .legend-box.selected {
      background: linear-gradient(145deg, #fbbf24, #d97706);
      box-shadow: 0 0 14px #fbbf24;
      border-color: #fde68a;
    }

    .legend-box.booked {
      background: #151022;
      opacity: 0.6;
      border-color: #2a1f3d;
    }

    /* booking summary */
    .summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(145deg, #1a1230, #120c22);
      padding: 18px 30px;
      border-radius: 70px;
      margin-top: 18px;
      border: 1px solid rgba(168, 85, 247, 0.3);
      box-shadow: inset 0 2px 8px #00000099, 0 12px 24px #00000055, 0 0 40px rgba(168, 85, 247, 0.1);
      flex-wrap: wrap;
      gap: 16px;
    }

    .selected-info {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      align-items: center;
    }

    .selected-info span {
      background: rgba(45, 35, 74, 0.8);
      padding: 10px 22px;
      border-radius: 40px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(168, 85, 247, 0.3);
      font-size: 0.95rem;
      color: #e0d4ff;
      backdrop-filter: blur(4px);
    }

    .selected-info i {
      color: #fbbf24;
      font-size: 1rem;
    }

    .total-price {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 20px rgba(251, 191, 36, 0.4));
    }

    .total-price small {
      font-size: 1rem;
      font-weight: 500;
      -webkit-text-fill-color: #b8a8d9;
      color: #b8a8d9;
      margin-left: 6px;
      background: none;
    }

    .book-btn {
      background: linear-gradient(145deg, #fbbf24, #d97706);
      border: none;
      padding: 16px 42px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1.15rem;
      color: #1a0f2e;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 16px 28px -8px #f59e0b, 0 0 0 1px rgba(255, 255, 255, 0.3) inset;
      letter-spacing: 0.3px;
      position: relative;
      overflow: hidden;
    }

    .book-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.4), transparent 60%);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .book-btn:hover {
      background: linear-gradient(145deg, #fcd34d, #f59e0b);
      transform: scale(1.03);
      box-shadow: 0 20px 34px -8px #f59e0b, 0 0 0 2px rgba(255, 255, 255, 0.5) inset;
    }

    .book-btn:hover::before {
      opacity: 1;
    }

    .book-btn:active {
      transform: scale(0.97);
    }

    .book-btn:disabled {
      opacity: 0.4;
      pointer-events: none;
      filter: grayscale(0.7);
    }

    /* responsive */
    @media (max-width: 750px) {
      .booking-container { padding: 24px; }
      .seat-grid { grid-template-columns: repeat(8, 1fr); gap: 10px; }
      .seat { width: 38px; height: 38px; font-size: 0.7rem; }
      .summary { flex-direction: column; align-items: stretch; border-radius: 30px; }
      .book-btn { justify-content: center; }
      h1 { font-size: 1.8rem; }
      .screen { width: 95%; letter-spacing: 4px; }
    }

    @media (max-width: 500px) {
      .seat-grid { grid-template-columns: repeat(5, 1fr); gap: 8px; }
      .seat { width: 34px; height: 34px; border-radius: 10px; }
      .movie-picker { flex-direction: column; }
      .legend { gap: 20px; font-size: 0.75rem; }
      .legend-box { width: 20px; height: 20px; }
    }

    /* notification */
    .toast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      background: linear-gradient(145deg, #2a1f4a, #1e1535);
      color: #fde68a;
      padding: 16px 38px;
      border-radius: 60px;
      font-weight: 600;
      box-shadow: 0 20px 40px #000000cc, 0 0 0 1px rgba(251, 191, 36, 0.4), 0 0 40px rgba(168, 85, 247, 0.2);
      transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.1);
      z-index: 999;
      pointer-events: none;
      border-left: 6px solid #fbbf24;
      backdrop-filter: blur(12px);
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .toast i {
      color: #fbbf24;
      font-size: 1.3rem;
    }
  </style>
</head>
<body>
  <div class="booking-container">
    <h1>
      <i class="fas fa-film"></i> CineVerse
    </h1>
    <div class="subhead">
      <p><i class="fas fa-map-pin"></i> PVR · IMAX · 4K Laser</p>
      <div class="date-badge"><i class="far fa-calendar-alt"></i> Today, 7:30 PM</div>
    </div>

    <!-- Movie selection -->
    <div class="movie-picker">
      <div class="movie-card active" data-movie="Dune: Part Two" data-price="12.99">
        <div class="movie-poster"><i class="fas fa-dragon"></i></div>
        <div class="movie-info">
          <h3>Dune: Part Two</h3>
          <div class="meta"><span>⭐ 8.8</span> <span>2h 46m</span></div>
        </div>
      </div>
      <div class="movie-card" data-movie="Oppenheimer" data-price="11.49">
        <div class="movie-poster"><i class="fas fa-atom"></i></div>
        <div class="movie-info">
          <h3>Oppenheimer</h3>
          <div class="meta"><span>⭐ 8.5</span> <span>3h 0m</span></div>
        </div>
      </div>
      <div class="movie-card" data-movie="Poor Things" data-price="10.99">
        <div class="movie-poster"><i class="fas fa-heart"></i></div>
        <div class="movie-info">
          <h3>Poor Things</h3>
          <div class="meta"><span>⭐ 8.0</span> <span>2h 21m</span></div>
        </div>
      </div>
      <div class="movie-card" data-movie="The Batman" data-price="13.49">
        <div class="movie-poster"><i class="fas fa-mask"></i></div>
        <div class="movie-info">
          <h3>The Batman</h3>
          <div class="meta"><span>⭐ 7.8</span> <span>2h 56m</span></div>
        </div>
      </div>
    </div>

    <!-- Screen + seat layout -->
    <div class="screen-area">
      <div class="screen">SCREEN</div>
      <div class="seat-grid" id="seatGrid"></div>
      <div class="legend">
        <div class="legend-item"><span class="legend-box"></span> Available</div>
        <div class="legend-item"><span class="legend-box selected"></span> Selected</div>
        <div class="legend-item"><span class="legend-box booked"></span> Booked</div>
      </div>
    </div>

    <!-- Summary & book button -->
    <div class="summary">
      <div class="selected-info" id="selectedInfo">
        <span><i class="fas fa-couch"></i> <span id="seatCount">0</span> seats</span>
        <span><i class="fas fa-tag"></i> <span id="movieTitle">Dune: Part Two</span></span>
      </div>
      <div>
        <span class="total-price" id="totalPrice">$0<small> USD</small></span>
      </div>
      <button class="book-btn" id="bookBtn" disabled>
        <i class="fas fa-ticket-alt"></i> Book now
      </button>
    </div>
  </div>

  <div id="toast" class="toast"><i class="fas fa-check-circle"></i> <span id="toastMsg">Tickets booked successfully!</span></div>

  <script>
    (function() {
      // ---------- STATE ----------
      const rows = 7;              // 7 rows
      const cols = 10;            // 10 columns
      let seats = [];             // { id, row, col, booked, selected }
      let currentMovie = {
        title: 'Dune: Part Two',
        price: 12.99
      };

      // DOM elements
      const seatGrid = document.getElementById('seatGrid');
      const seatCountSpan = document.getElementById('seatCount');
      const movieTitleSpan = document.getElementById('movieTitle');
      const totalPriceSpan = document.getElementById('totalPrice');
      const bookBtn = document.getElementById('bookBtn');
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const movieCards = document.querySelectorAll('.movie-card');

      // ---------- INIT SEATS (some pre-booked) ----------
      function initSeats() {
        seats = [];
        // define some booked seats (deterministic, but feels organic)
        const bookedSet = new Set([
          '0-3','0-4','1-7','1-8','2-1','2-2','3-9','4-0','4-5','5-6','5-7',
          '0-9','2-7','3-4','6-2','6-3','6-4','5-1','1-3','3-6','4-8','2-9',
          '6-7','6-8','0-7','1-0','5-9','4-2','3-1','6-5'
        ]);

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const id = `${r}-${c}`;
            const isBooked = bookedSet.has(id);
            seats.push({
              id,
              row: r,
              col: c,
              booked: isBooked,
              selected: false
            });
          }
        }
      }

      // render seats based on current state
      function renderSeats() {
        let html = '';
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const seat = seats.find(s => s.row === r && s.col === c);
            let classes = 'seat';
            if (seat.booked) classes += ' booked';
            if (seat.selected) classes += ' selected';
            // we add a tiny icon for booked to make it clear
            const content = seat.booked ? '<i class="fas fa-times"></i>' : (seat.selected ? '<i class="fas fa-check"></i>' : '');
            html += `<div class="${classes}" data-id="${seat.id}" data-row="${r}" data-col="${c}">${content}</div>`;
          }
        }
        seatGrid.innerHTML = html;
      }

      // update summary (selected seats count, total price, movie title, button state)
      function updateSummary() {
        const selectedSeats = seats.filter(s => s.selected);
        const count = selectedSeats.length;
        seatCountSpan.textContent = count;
        movieTitleSpan.textContent = currentMovie.title;

        const total = (count * currentMovie.price).toFixed(2);
        totalPriceSpan.innerHTML = `$${total}<small> USD</small>`;

        bookBtn.disabled = count === 0;
      }

      // show toast message
      function showToast(msg) {
        toastMsg.textContent = msg || 'Tickets booked successfully!';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3200);
      }

      // reset selection (when switching movies)
      function resetSelection() {
        seats.forEach(s => {
          if (!s.booked) s.selected = false;
        });
        renderSeats();
        updateSummary();
      }

      // handle seat click
      function handleSeatClick(e) {
        const seatDiv = e.target.closest('.seat');
        if (!seatDiv) return;
        const seatId = seatDiv.dataset.id;
        const seat = seats.find(s => s.id === seatId);
        if (!seat || seat.booked) return;   // ignore booked seats

        // toggle selection
        seat.selected = !seat.selected;
        renderSeats();
        updateSummary();
      }

      // book action
      function handleBook() {
        const selectedSeats = seats.filter(s => s.selected);
        if (selectedSeats.length === 0) return;

        // mark as booked (simulate)
        selectedSeats.forEach(s => {
          s.booked = true;
          s.selected = false;
        });

        renderSeats();
        updateSummary();
        showToast(`🎟️ ${selectedSeats.length} ticket${selectedSeats.length > 1 ? 's' : ''} booked for "${currentMovie.title}"!`);
      }

      // switch movie (update currentMovie, reset selections, update active card)
      function switchMovie(card) {
        const title = card.dataset.movie;
        const price = parseFloat(card.dataset.price);
        if (!title || isNaN(price)) return;

        // update active class
        movieCards.forEach(c => c.classList.remove('active'));
        card.classList.add('active');

        currentMovie = { title, price };
        // reset any non-booked selections
        resetSelection();
        movieTitleSpan.textContent = currentMovie.title;
        updateSummary();
      }

      // ---------- EVENT LISTENERS ----------
      seatGrid.addEventListener('click', handleSeatClick);
      bookBtn.addEventListener('click', handleBook);

      movieCards.forEach(card => {
        card.addEventListener('click', (e) => {
          switchMovie(card);
        });
      });

      // ---------- INITIAL RENDER ----------
      initSeats();
      renderSeats();
      updateSummary();

      // set initial movie title and price from first active card
      const activeCard = document.querySelector('.movie-card.active');
      if (activeCard) {
        currentMovie.title = activeCard.dataset.movie;
        currentMovie.price = parseFloat(activeCard.dataset.price);
        movieTitleSpan.textContent = currentMovie.title;
      }
      updateSummary();
    })();
  </script>
</body>
</html>
